# Argo CD's root application (D67, D100), the same in every environment: the platform repo (locally the
# checkout's snapshot, in Azure GitHub), rendered by the platform plugin. Filled in by the CLI and by
# stacks/environment/scripts/argocd.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: @repo@
    targetRevision: main
    path: .
    plugin:
      name: platform
      env:
        - { name: MODE, value: cluster }
        - { name: ENVIRONMENT, value: @environment@ }
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
