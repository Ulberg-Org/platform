# Argo CD for the local platform (D61): deploys each app from its rendered manifests, as in Azure (Phase 4).
# Only what deploys runs locally: no SSO (Dex), no notifications, no ApplicationSets.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
configs:
  params:
    # Nobody signs in to it locally; `platform` reports the sync state.
    server.insecure: true
  cm:
    # `platform sync` asks for a refresh right away; this is the fallback.
    timeout.reconciliation: 60s
