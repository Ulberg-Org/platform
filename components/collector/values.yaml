fullnameOverride: collector
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
# The cluster's events (scheduling failures, OOM kills, failed probes, image pulls), collected once, here.
presets:
  kubernetesEvents: { enabled: true }
# Only OTLP in; the chart's other default receivers (Jaeger, Zipkin, its own Prometheus) stay off.
ports:
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    # values-<environment>.yaml names the environment (deployment.environment.name).
    resource:
      attributes: []
    # The cluster's events arrive without a service; this is their name in Loki.
    resource/events:
      attributes:
        - { key: service.name, value: kubernetes-events, action: upsert }
  exporters:
    otlp_grpc/tempo:
      endpoint: tempo:4317
      tls: { insecure: true }
    otlp_http/loki:
      endpoint: http://loki:3100/otlp
    otlp_http/prometheus:
      endpoint: http://prometheus-server/api/v1/otlp
  service:
    pipelines:
      traces: { receivers: [ otlp ], processors: [ memory_limiter, resource, batch ], exporters: [ otlp_grpc/tempo ] }
      logs/events: { receivers: [ k8sobjects ], processors: [ memory_limiter, resource, resource/events, batch ], exporters: [ otlp_http/loki ] }
      logs: { receivers: [ otlp ], processors: [ memory_limiter, resource, batch ], exporters: [ otlp_http/loki ] }
      metrics: { receivers: [ otlp ], processors: [ memory_limiter, resource, batch ], exporters: [ otlp_http/prometheus ] }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ ALL ] }
  seccompProfile: { type: RuntimeDefault }
