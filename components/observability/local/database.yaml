# Locally the collector reads Postgres's metrics (D64): out to the database containers on port 5432, by name
# (which needs DNS inspected). In Azure the metrics come from Azure Monitor instead.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: observability-database
  namespace: observability
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: opentelemetry-collector, app.kubernetes.io/instance: collector }
  egress:
    - toEndpoints:
        - matchLabels: { "k8s:io.kubernetes.pod.namespace": kube-system, k8s-app: kube-dns }
      toPorts: [ { ports: [ { port: "53", protocol: ANY } ], rules: { dns: [ { matchPattern: "*" } ] } } ]
    - toFQDNs: [ { matchPattern: "*" } ]
      toPorts: [ { ports: [ { port: "5432", protocol: TCP } ] } ]
