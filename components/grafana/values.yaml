fullnameOverride: grafana
persistence: { enabled: false }
grafana.ini:
  analytics: { reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false }
  auth.anonymous: { enabled: false }
# The three data sources, linked: from a trace to its logs and metrics, from a log line to its trace.
# By their full names, which a machine's proxy settings leave alone (NO_PROXY: .svc; Claude's sandbox, D81).
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.observability.svc
        isDefault: true
        jsonData:
          # A metric's exemplar (a sample request) opens its trace in Tempo.
          exemplarTraceIdDestinations: [ { name: trace_id, datasourceUid: tempo } ]
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.observability.svc:3100
        jsonData:
          derivedFields:
            - name: trace
              datasourceUid: tempo
              matcherType: label
              matcherRegex: trace_id
              url: "$${__value.raw}"
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.observability.svc:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
          tracesToMetrics: { datasourceUid: prometheus }
          serviceMap: { datasourceUid: prometheus }
          nodeGraph: { enabled: true }
testFramework: { enabled: false }
# Grafana's Drilldown apps (Grafana Labs' own): browse logs, traces and metrics without writing queries, the way
# most teams start an investigation.
# Pinned (D65), past the cooldown.
plugins: [ grafana-lokiexplore-app@3.1.0, grafana-exploretraces-app@3.2.0, grafana-metricsdrilldown-app@3.1.0 ]
# Dashboards and alert rules as code (D71): the sidecar loads the ConfigMaps in common/ (labelled grafana_dashboard
# and grafana_alert) when Grafana starts and whenever they change.
sidecar:
  dashboards: { enabled: true, label: grafana_dashboard }
  alerts: { enabled: true, label: grafana_alert }
