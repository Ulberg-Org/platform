# Grafana dashboards as code (D71): Grafana's sidecar loads every ConfigMap labelled grafana_dashboard.
# Edited here, never in Grafana.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-services
  namespace: observability
  labels: { grafana_dashboard: "1" }
data:
  services.json: |
    {
     "uid": "services",
     "title": "Services: requests, errors, latency",
     "schemaVersion": 41,
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "refresh": "30s",
     "tags": [
      "platform"
     ],
     "panels": [
      {
       "type": "timeseries",
       "title": "Requests per second, per service and route",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (service_name, http_route) (rate(http_server_request_duration_seconds_count[5m]))",
         "legendFormat": "{{service_name}} {{http_route}}"
        }
       ],
       "id": 1
      },
      {
       "type": "timeseries",
       "title": "Errors (5xx) as a share of requests",
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) / sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))",
         "legendFormat": "{{service_name}}"
        }
       ],
       "id": 2
      },
      {
       "type": "timeseries",
       "title": "Latency p95, per service and route",
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "histogram_quantile(0.95, sum by (le, service_name, http_route) (rate(http_server_request_duration_seconds_bucket[5m])))",
         "legendFormat": "{{service_name}} {{http_route}}"
        }
       ],
       "id": 3
      },
      {
       "type": "timeseries",
       "title": "The gateway: requests per route",
       "gridPos": {
        "x": 12,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~\"httproute.*\"}[5m]))",
         "legendFormat": "{{envoy_cluster_name}}"
        }
       ],
       "id": 4
      }
     ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-pods
  namespace: observability
  labels: { grafana_dashboard: "1" }
data:
  pods.json: |
    {
     "uid": "pods",
     "title": "Pods: CPU and memory against requests and limits",
     "schemaVersion": 41,
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "refresh": "30s",
     "tags": [
      "platform"
     ],
     "panels": [
      {
       "type": "timeseries",
       "title": "CPU per pod (cores)",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))",
         "legendFormat": "{{namespace}}/{{pod}}"
        }
       ],
       "id": 1
      },
      {
       "type": "timeseries",
       "title": "CPU used / requested, per pod",
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) / sum by (namespace, pod) (kube_pod_container_resource_requests{resource=\"cpu\"})",
         "legendFormat": "{{namespace}}/{{pod}}"
        }
       ],
       "id": 2
      },
      {
       "type": "timeseries",
       "title": "Memory per pod",
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "bytes"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\"})",
         "legendFormat": "{{namespace}}/{{pod}}"
        }
       ],
       "id": 3
      },
      {
       "type": "timeseries",
       "title": "Memory used / limit, per pod (no limit: no line)",
       "gridPos": {
        "x": 12,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\"}) / sum by (namespace, pod) (kube_pod_container_resource_limits{resource=\"memory\"})",
         "legendFormat": "{{namespace}}/{{pod}}"
        }
       ],
       "id": 4
      },
      {
       "type": "timeseries",
       "title": "Restarts in the last hour",
       "gridPos": {
        "x": 0,
        "y": 16,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h]))",
         "legendFormat": "{{namespace}}/{{pod}}"
        }
       ],
       "id": 5
      }
     ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-argocd
  namespace: observability
  labels: { grafana_dashboard: "1" }
data:
  argocd.json: |
    {
     "uid": "argocd",
     "title": "Argo CD: sync and health",
     "schemaVersion": 41,
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "refresh": "30s",
     "tags": [
      "platform"
     ],
     "panels": [
      {
       "type": "timeseries",
       "title": "Applications not in sync",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "count by (name) (argocd_app_info{sync_status!=\"Synced\"})",
         "legendFormat": "{{name}}"
        }
       ],
       "id": 1
      },
      {
       "type": "timeseries",
       "title": "Applications not healthy",
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "count by (name, health_status) (argocd_app_info{health_status!=\"Healthy\"})",
         "legendFormat": "{{name}} {{health_status}}"
        }
       ],
       "id": 2
      },
      {
       "type": "timeseries",
       "title": "Syncs per application",
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (name, phase) (increase(argocd_app_sync_total[1h]))",
         "legendFormat": "{{name}} {{phase}}"
        }
       ],
       "id": 3
      }
     ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-network
  namespace: observability
  labels: { grafana_dashboard: "1" }
data:
  network.json: |
    {
     "uid": "network",
     "title": "Network: dropped connections",
     "schemaVersion": 41,
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "refresh": "30s",
     "tags": [
      "platform"
     ],
     "panels": [
      {
       "type": "timeseries",
       "title": "Drops per reason",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "pps"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (reason) (rate(hubble_drop_total[5m]))",
         "legendFormat": "{{reason}}"
        }
       ],
       "id": 1
      },
      {
       "type": "timeseries",
       "title": "Dropped by the network rules, per source and destination namespace",
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "pps"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (source, destination) (rate(hubble_policy_verdicts_total{action=\"dropped\"}[5m]))",
         "legendFormat": "{{source}} -> {{destination}}"
        }
       ],
       "id": 2
      },
      {
       "type": "logs",
       "title": "Dropped flows (Hubble)",
       "datasource": {
        "type": "loki",
        "uid": "loki"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "{service_name=\"network-flows\"}"
        }
       ],
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "id": 3
      }
     ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-postgres
  namespace: observability
  labels: { grafana_dashboard: "1" }
data:
  postgres.json: |
    {
     "uid": "postgres",
     "title": "Postgres",
     "schemaVersion": 41,
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "refresh": "30s",
     "tags": [
      "platform"
     ],
     "panels": [
      {
       "type": "timeseries",
       "title": "Connections per database",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (postgresql_database_name) (postgresql_backends)",
         "legendFormat": "{{postgresql_database_name}}"
        }
       ],
       "id": 1
      },
      {
       "type": "timeseries",
       "title": "Commits and rollbacks",
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "ops"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (postgresql_database_name) (rate(postgresql_commits_total[5m]))",
         "legendFormat": "commits {{postgresql_database_name}}"
        },
        {
         "refId": "B",
         "expr": "sum by (postgresql_database_name) (rate(postgresql_rollbacks_total[5m]))",
         "legendFormat": "rollbacks {{postgresql_database_name}}"
        }
       ],
       "id": 2
      },
      {
       "type": "timeseries",
       "title": "Cache hit ratio",
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(rate(postgresql_blocks_read_total{source=\"heap_hit\"}[5m])) / sum(rate(postgresql_blocks_read_total{source=~\"heap_hit|heap_read\"}[5m]))",
         "legendFormat": "heap hits"
        }
       ],
       "id": 3
      },
      {
       "type": "timeseries",
       "title": "Database size",
       "gridPos": {
        "x": 12,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "bytes"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (postgresql_database_name) (postgresql_db_size_bytes)",
         "legendFormat": "{{postgresql_database_name}}"
        }
       ],
       "id": 4
      },
      {
       "type": "timeseries",
       "title": "Deadlocks",
       "gridPos": {
        "x": 0,
        "y": 16,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(increase(postgresql_deadlocks_total[1h]))",
         "legendFormat": "deadlocks"
        }
       ],
       "id": 5
      }
     ]
    }
