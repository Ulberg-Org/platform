# The collector on every node (D71): reads every container's log (and locally the Kubernetes API's audit log),
# labels each line with its namespace, pod and container, and forwards it to the central collector, which stays
# the one way out to Loki, Tempo and Prometheus. The same chart as components/collector, in daemonset mode.
