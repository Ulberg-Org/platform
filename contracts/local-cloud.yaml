# The contract between local development and the cloud (D58), and the first piece of the one model that
# every environment will be rendered from (D60). Local (todo's make up) and Azure (Phase 3/5) must both
# match it; todo's CI fails if its local files drift from it.
database:
  name: todo
  roles:
    migrator: todo_migrator # owns the schema; used only by migrations
    app: todo_app # reads and writes the app's tables
    readonly: todo_readonly # reads only: people and agents debugging
telemetry:
  # service.name of each source, the same locally and in the cloud.
  services:
    backend: todo-backend
    database: postgres
  # Every signal carries the environment it came from.
  environmentAttribute: deployment.environment.name
agentTools:
  # Claude's access to a running environment: read-only by tool configuration and by role.
  grafana:
    image: grafana/mcp-grafana
    flags: [-disable-write, -disable-admin]
  postgres:
    image: crystaldba/postgres-mcp
    flags: [--access-mode=restricted]
    role: readonly
