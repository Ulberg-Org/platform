# Starts or updates an environment from code (D45): `pulumi up` of its stack, in the `dev` GitHub environment
# (`main` only). The pulumi workflow calls it after every merge (D99: the PR's approval is the only one into dev);
# it can also be run by hand. `destroy` removes the environment 4 hours after its latest start.
name: start

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to start (destroyed 4 hours after its latest start)
        type: choice
        options: [ dev ]
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

env:
  PULUMI_VERSION: 3.274.1
  PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
  # The Azure providers sign in with the job's GitHub OIDC token; the state backend and the
  # Key Vault secrets provider use the az CLI session from azure/login.
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_KEYVAULT_AUTH_VIA_CLI: "true"
  AZURE_TOKEN_CREDENTIALS: AzureCLICredential

jobs:
  start:
    name: start ${{ inputs.environment }}
    # One run per environment at a time, shared with `destroy`.
    concurrency:
      group: environment-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Azure sign-in (apply identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The environment stack signs in to AKS through kubelogin (Entra only, no local accounts; D84).
      - uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: v0.2.22
      # Only installs the CLI (no command).
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}
      - name: Release a lock a cancelled run left
        working-directory: stacks/environment
        run: pulumi login "$PULUMI_BACKEND_URL" && ../../.github/scripts/release_stale_lock.sh "${{ inputs.environment }}"
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: up
          stack-name: ${{ inputs.environment }}
          work-dir: stacks/environment
          # Reconciles the state with Azure first, in case a cancelled run left it half-written.
          refresh: true
          # Carries on with whatever doesn't depend on a failure, so one run shows every independent one (D98).
          continue-on-error: true
          upsert: true
          secrets-provider: azurekeyvault://kv-platform-21784576.vault.azure.net/keys/pulumi
          pulumi-version: ${{ env.PULUMI_VERSION }}
