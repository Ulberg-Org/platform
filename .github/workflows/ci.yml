name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2
  # The release tarball's SHA-256, pinned here (D65): a checksum fetched from the same release proves nothing.
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  prompt-log:
    name: prompt log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check .prompts/ format
        run: python3 .github/scripts/check_prompt_log.py
      - name: Test the prompt-log hook
        run: python3 .claude/hooks/test_prompt_log.py
      - name: Test the agent-identity hook (D41)
        run: python3 .claude/hooks/test_agent_identity.py
      - name: Agent-identity hook matches todo (same owner)
        run: |
          for f in agent_identity.py test_agent_identity.py; do
            curl -sSfL "https://raw.githubusercontent.com/${{ github.repository_owner }}/todo/main/.claude/hooks/$f" | diff -u - ".claude/hooks/$f"
          done

  dotnet:
    name: dotnet (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          # Packages restored from the cache, keyed on the lock files (D65).
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet tool restore
      - name: F# style (no mutation, discarded results or null)
        run: .github/scripts/check_fsharp_style.sh
      - name: Style guide matches todo (same owner)
        run: curl -sSfL https://raw.githubusercontent.com/${{ github.repository_owner }}/todo/main/docs/fsharp-style.md | diff -u - docs/fsharp-style.md
      - name: Format (Fantomas)
        run: dotnet fantomas --check stacks tests lib renderer
      - name: Build (warnings are errors)
        run: dotnet build platform.slnx -c Release
      - name: Test (includes access/people.yaml and CODEOWNERS)
        run: dotnet run --project tests/Access.Tests -c Release --no-build
      - name: Test the shared stack
        run: dotnet run --project tests/Shared.Tests -c Release --no-build
      - name: Test the environment stack
        run: dotnet run --project tests/Environment.Tests -c Release --no-build
      - name: Test which environments destroy removes (D45)
        run: .github/scripts/test_due_environments.sh
      - name: Test the teardown guard (guard.yml)
        run: .github/scripts/test_check_teardown_use.sh
      - name: Test releasing a cancelled run's lock (start, destroy)
        run: .github/scripts/test_release_stale_lock.sh
      - name: Test the renderer (D60, D62)
        run: dotnet run --project tests/Renderer.Tests -c Release --no-build
      - name: Platform charts are the packages their digests pin (D65)
        run: .github/scripts/check_chart_digests.sh
      - name: Workflows follow the stack order (D53)
        run: .github/scripts/check_stack_order.sh
