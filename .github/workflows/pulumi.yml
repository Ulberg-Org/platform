name: pulumi

# Preview on every PR, on main and every night (drift and standing access). Apply only on pushes to main,
# after a platform lead approves the `dev` environment. Azure only issues a token for the apply identity
# to an approved `dev` job.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

env:
  PULUMI_VERSION: 3.274.1
  PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
  # The Azure providers sign in with the job's GitHub OIDC token; the state backend and the
  # Key Vault secrets provider use the az CLI session from azure/login.
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_KEYVAULT_AUTH_VIA_CLI: "true"
  # The state backend signs in with the az CLI session only. Without this it tries managed identity first,
  # and a runner whose metadata endpoint answers 401 stops it there ("failed to acquire a token").
  AZURE_TOKEN_CREDENTIALS: AzureCLICredential

jobs:
  preview:
    name: pulumi preview
    # One queue per branch: a newer push cancels its outdated preview, but PRs never cancel each other and
    # never wait behind an apply that is waiting for approval. If an apply is running at that moment,
    # Pulumi's state lock refuses the preview, which then fails visibly and can be rerun.
    concurrency:
      group: pulumi-preview-${{ github.ref }}
      cancel-in-progress: true
    # Dependabot runs get no OIDC token or secrets. It only bumps GitHub Actions versions.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Azure sign-in (read-only preview identity)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Standing access check (D35, D36)
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: .github/scripts/check_standing_access.sh
      - name: Agent access check (D41)
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: .github/scripts/check_agent_access.sh
      - name: GitHub token (read-only app)
        id: github
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PLATFORM_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_READER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform,todo
      - name: GitHub access check (D43, D52)
        env:
          GH_TOKEN: ${{ steps.github.outputs.token }}
        run: .github/scripts/check_github_access.sh
      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: main
          work-dir: stacks/access
          pulumi-version: ${{ env.PULUMI_VERSION }}
          diff: true
          comment-on-summary: true
        env:
          GITHUB_TOKEN: ${{ steps.github.outputs.token }}
          # PIM alert recipients (D40). A secret because the repo is public; the stack keeps it a Pulumi secret.
          PLATFORM_ALERT_EMAILS: ${{ secrets.PLATFORM_ALERT_EMAILS }}
      # Stacks in the order of stacks/order.yaml (D53); check_stack_order.sh keeps the two in step.
      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: main
          work-dir: stacks/shared
          # Creates the stack on its first run, with the same Key Vault key as access for secrets.
          upsert: true
          secrets-provider: azurekeyvault://kv-platform-21784576.vault.azure.net/keys/pulumi
          pulumi-version: ${{ env.PULUMI_VERSION }}
          diff: true
          comment-on-summary: true
        env:
          GITHUB_TOKEN: ${{ steps.github.outputs.token }}

  apply:
    name: pulumi up
    # Applies run one at a time and are never cancelled halfway through.
    concurrency:
      group: pulumi-apply
      cancel-in-progress: false
    if: github.event_name == 'push'
    needs: preview
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Azure sign-in (apply identity, dev environment only)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: GitHub token (admin app)
        id: github
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PLATFORM_ADMIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_ADMIN_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform,todo
      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: main
          work-dir: stacks/access
          pulumi-version: ${{ env.PULUMI_VERSION }}
          diff: true
          comment-on-summary: true
        env:
          GITHUB_TOKEN: ${{ steps.github.outputs.token }}
          # PIM alert recipients (D40). A secret because the repo is public; the stack keeps it a Pulumi secret.
          PLATFORM_ALERT_EMAILS: ${{ secrets.PLATFORM_ALERT_EMAILS }}
      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: main
          work-dir: stacks/shared
          # Creates the stack on its first run, with the same Key Vault key as access for secrets.
          upsert: true
          secrets-provider: azurekeyvault://kv-platform-21784576.vault.azure.net/keys/pulumi
          pulumi-version: ${{ env.PULUMI_VERSION }}
          diff: true
          comment-on-summary: true
        env:
          GITHUB_TOKEN: ${{ steps.github.outputs.token }}
