# A release of the platform CLI (D63): a vX.Y.Z tag builds, publishes and signs two public images on GHCR, for
# arm64 (developer Macs) and amd64:
#   ghcr.io/ulberg-org/platform-renderer   the renderer, which Argo CD's plugin and the CLI run
#   ghcr.io/ulberg-org/platform-cli        the CLI with its tools, naming that renderer image by digest
# Signed keyless with cosign; the signature names this workflow and the tag, which `make up` and the CLI verify.
# The images hold only what local development needs; everything about Azure stays out (see cli/Dockerfile).
name: release

on:
  push:
    tags: [ "v*.*.*" ]

permissions: {}

jobs:
  release:
    name: build, publish and sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign's keyless signature
    env:
      RENDERER: ghcr.io/ulberg-org/platform-renderer
      CLI: ghcr.io/ulberg-org/platform-cli
    steps:
      - name: The tag is MAJOR.MINOR.PATCH
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a vX.Y.Z tag: $GITHUB_REF_NAME"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Renderer image
        id: renderer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: renderer/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ env.RENDERER }}:${{ github.ref_name }}
      - name: Sign the renderer image
        run: cosign sign --yes "$RENDERER@${{ steps.renderer.outputs.digest }}"

      - name: CLI image
        id: cli
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cli/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ env.CLI }}:${{ github.ref_name }}
          build-args: |
            RENDERER_IMAGE=${{ env.RENDERER }}:${{ github.ref_name }}@${{ steps.renderer.outputs.digest }}
            VERSION=${{ github.ref_name }}
      - name: Sign the CLI image
        run: cosign sign --yes "$CLI@${{ steps.cli.outputs.digest }}"

      - name: Summary (what todo's Makefile pins)
        run: |
          {
            echo "### Platform ${GITHUB_REF_NAME}"
            echo "- CLI: \`$CLI:${GITHUB_REF_NAME}@${{ steps.cli.outputs.digest }}\`"
            echo "- Renderer: \`$RENDERER:${GITHUB_REF_NAME}@${{ steps.renderer.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
