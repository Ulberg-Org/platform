# Destroys every environment 4 hours after it started (D45), without approval; or one environment at once,
# by hand. A cheap check first (the read-only identity), so the destroy job (the `teardown` environment and
# the apply identity) runs only when there is something to destroy.
name: destroy

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to destroy now
        type: choice
        options: [ dev ]

permissions:
  contents: read

env:
  PULUMI_VERSION: 3.274.1
  PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_KEYVAULT_AUTH_VIA_CLI: "true"
  AZURE_TOKEN_CREDENTIALS: AzureCLICredential

jobs:
  due:
    name: which environments are due
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      environments: ${{ steps.due.outputs.environments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure sign-in (read-only identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: due
        env:
          ASKED: ${{ inputs.environment }}
        run: echo "environments=$(.github/scripts/due_environments.sh "$ASKED")" >>"$GITHUB_OUTPUT"

  destroy:
    name: destroy ${{ matrix.environment }}
    needs: due
    if: needs.due.outputs.environments != '[]'
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.due.outputs.environments) }}
    concurrency:
      group: environment-${{ matrix.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: teardown
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Azure sign-in (apply identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The environment stack signs in to AKS through kubelogin (Entra only, no local accounts; D84).
      - uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: v0.2.22
      # Only installs the CLI (no command).
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}
      - name: Release a lock a cancelled run left
        working-directory: stacks/environment
        run: pulumi login "$PULUMI_BACKEND_URL" && ../../.github/scripts/release_stale_lock.sh "${{ matrix.environment }}"
      - id: destroy
        # A failure falls back to the next two steps rather than leaving the environment half-destroyed.
        continue-on-error: true
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: destroy
          stack-name: ${{ matrix.environment }}
          work-dir: stacks/environment
          # Reconciles the state with Azure first, in case a cancelled run left it half-written.
          refresh: true
          pulumi-version: ${{ env.PULUMI_VERSION }}
      # The fallback (D45: an environment is disposable): delete its resource group, which takes everything in it
      # (and AKS its node group), then destroy again, which finds that gone and removes the rest (its role
      # assignments on shared) from Azure and the state.
      - name: Fall back to deleting the environment's resource group
        if: steps.destroy.outcome == 'failure'
        env:
          GROUP: rg-${{ matrix.environment }}
        run: az group delete --name "$GROUP" --yes || [ "$(az group exists --name "$GROUP")" = false ]
      - if: steps.destroy.outcome == 'failure'
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: destroy
          stack-name: ${{ matrix.environment }}
          work-dir: stacks/environment
          refresh: true
          pulumi-version: ${{ env.PULUMI_VERSION }}
