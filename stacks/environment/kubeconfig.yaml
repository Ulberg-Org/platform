# CI's kubeconfig for the environment's cluster (D84): no credential in it; kubelogin turns the job's az session
# (azure/login with GitHub's OIDC token) into an Entra token for AKS (its server id below is the same everywhere).
apiVersion: v1
kind: Config
clusters:
  - name: cluster
    cluster:
      server: https://@server@:443
      certificate-authority-data: @ca@
users:
  - name: ci
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: kubelogin
        args:
          - get-token
          - --login
          - azurecli
          - --server-id
          - 6dae42f8-4368-4678-94ff-3960e28e3630
        interactiveMode: Never
contexts:
  - name: ci
    context: { cluster: cluster, user: ci }
current-context: ci
