# Secrets: the same Key Vault key and data key as the other stacks (bootstrap/README.md).
secretsprovider: azurekeyvault://kv-platform-21784576.vault.azure.net/keys/pulumi
encryptedkey: 
config:
  # The tenant and subscription come from CI's environment (ARM_TENANT_ID, ARM_SUBSCRIPTION_ID).
  azure-native:location: swedencentral
  # What shared keeps for every environment (D45, D89): its address, and the registry the cluster pulls from.
  environment:sharedGroup: rg-platform-shared
  environment:registryName: crplatform21784576
  # Makes the database's name globally unique.
  environment:namePrefix: ulberg
  # D70, D86: the VNet, the AKS nodes' subnet, the database's (delegated to Postgres).
  environment:vnet: 10.20.0.0/16
  environment:nodes: 10.20.0.0/23
  environment:database: 10.20.2.0/24
  # D84: 2 ARM nodes. D2ps_v7: the subscription has vCPU quota for it here (DPSv5's is 0; v6 isn't offered).
  environment:kubernetesVersion: "1.37"
  environment:nodeSize: Standard_D2ps_v7
  environment:nodeCount: 2
  # D85: Postgres 18 (the newest Azure offers), the smallest burstable size.
  environment:postgresVersion: "18"
  environment:postgresSku: Standard_B1ms
