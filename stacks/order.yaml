# The order the stacks are set up in (D53). Teardown runs in reverse; an environment's teardown stops at its
# own stack, and a full platform teardown stops before `access` (which holds CI's own rights) and the manual
# bootstrap. Environment stacks (stacks/environment: dev, later prod) aren't in this order: `start` creates them
# and `destroy` removes them (D45); pulumi.yml previews them in their own job.
- access
- shared
